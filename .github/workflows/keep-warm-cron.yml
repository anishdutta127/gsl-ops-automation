name: keep-warm-cron

# Neon free tier auto-suspends compute after ~5 min idle. First query
# after suspend takes 3-10s (cold-start). This cron pings the DB every
# 4 minutes during IST working hours (7am-9pm = 01:30-15:30 UTC) so
# the compute stays warm for real users.
#
# Uses the same CRON_SECRET as sync-queue-cron.

on:
  schedule:
    - cron: '*/4 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: keep-warm-cron
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check IST working hours
        id: hours
        run: |
          utc_hour=$(date -u +%H)
          # IST = UTC+5:30. 7am IST = 01:30 UTC, 9pm IST = 15:30 UTC.
          # Approximate: run between UTC 01-16 (covers 6:30am-9:30pm IST).
          if [ "$utc_hour" -ge 1 ] && [ "$utc_hour" -le 16 ]; then
            echo "working_hours=true" >> "$GITHUB_OUTPUT"
          else
            echo "working_hours=false" >> "$GITHUB_OUTPUT"
            echo "Outside IST working hours (UTC ${utc_hour}); skipping."
          fi

      - name: Ping /api/cron/keep-warm
        if: steps.hours.outputs.working_hours == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT_URL: https://gsl-ops-automation.vercel.app/api/cron/keep-warm
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET missing"
            exit 1
          fi
          response=$(curl --silent --show-error --max-time 30 \
            --write-out "\n%{http_code}" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${ENDPOINT_URL}")
          status=$(printf '%s' "${response}" | tail -n1)
          body=$(printf '%s' "${response}" | sed '$d')
          echo "HTTP ${status}: ${body}"
          if [ "${status}" != "200" ]; then
            echo "::warning::keep-warm ping returned HTTP ${status}"
          fi
